# Builds Darkride for Windows and publishes the installer and zip as a GitHub release.
#
#   git tag v2026.10.1 && git push origin v2026.10.1    builds, and makes the release "Darkride 2026.10.1"
#   a tag with a dash, such as v2026.10.1-beta1          the same, marked as a pre-release
#   a push to the darkride-builds branch                 builds it, to catch breakage; the files are kept as a
#                                                        workflow artifact for two weeks, and nothing is published
#   Actions > Windows release > Run workflow              the same for any branch (once this file is on the
#                                                        repository's default branch, which GitHub requires)
#
# The steps follow BUILD_WINDOWS.md. A first run takes a few hours: vcpkg builds every dependency. vcpkg's packages
# and Qt are cached, so later runs only compile Darkride.

name: Windows release

on:
  push:
    tags: ["v*"]
    branches: [darkride-builds]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the file names (default 0.0.0-<commit>)
        required: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # VS 2022. windows-2025 has VS 2026, which also works (BUILD_WINDOWS_VISUAL_STUDIO.md) with -T v143
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # short paths: vcpkg's folders go deep, and long paths aren't enabled on the runner
      TIVOLI_VCPKG_BASE: C:\dv
      VCPKG_DEFAULT_BINARY_CACHE: C:\dvcache
      QT_DIR_BASE: C:\Qt
      QT_CMAKE_PREFIX_PATH: C:/Qt/5.15.2/msvc2019_64/lib/cmake
      BUILD_DIR: C:\b
      # a production build: the data folder is "Darkride", and the stable metaverse (vr.darkride.ai) is used
      RELEASE_TYPE: PRODUCTION
      STABLE_BUILD: 1

    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^v', '' }
          elseif ("${{ inputs.version }}") { $v = "${{ inputs.version }}" }
          else { $v = "0.0.0-" + "${{ github.sha }}".Substring(0, 8) }
          "Version $v"
          "VERSION=$v" >> $env:GITHUB_ENV
          "RELEASE_NUMBER=$v" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          Get-PSDrive C, D | Format-Table Name, @{n="Free GB"; e={[int]($_.Free / 1GB)}}

      # vcpkg's December 2021 version recognises compilers only up to 14.3x, so it needs the 14.39 toolset beside
      # VS 2022's own 14.4x; ATL is for the speech recognition code (sphelper.h)
      - name: Add the MSVC 14.39 toolset
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" -ArgumentList @(
            "modify", "--installPath", "`"$vs`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.39.17.9.ATL",
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--quiet", "--norestart", "--nocache")
          Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object Name
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.39.*")) { throw "The 14.39 toolset didn't install (exit $($p.ExitCode))" }

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-5.15.2-msvc2019_64-webengine-script-webgl

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -m qtwebengine qtscript qtwebglplugin -O $env:QT_DIR_BASE

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\dvcache
          key: vcpkg-windows-${{ hashFiles('cmake/ports/**', 'hifi_vcpkg.py') }}
          restore-keys: vcpkg-windows-

      # vcpkg builds (or restores) the dependencies here, as part of configuring
      - name: Configure
        shell: pwsh
        run: cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\dvcache
          key: vcpkg-windows-${{ hashFiles('cmake/ports/**', 'hifi_vcpkg.py') }}

      # /m:2: each project already compiles 4 files at once (/MP), and the runner has 16 GB
      - name: Build
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target interface domain-server assignment-client -- /m:2 /v:minimal /nologo

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./tools/installer/package-windows.ps1 -BuildDir $env:BUILD_DIR -Version $env:VERSION -OutDir dist

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: Darkride-${{ env.VERSION }}-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14
          compression-level: 0

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pre = if ($tag -like "*-*") { "--prerelease" } else { $null }
          $files = Get-ChildItem dist -File | Where-Object Extension -in ".exe", ".zip" | ForEach-Object FullName
          $notes = @"
          Windows build of $tag.

          - **Darkride-$env:VERSION-windows-x64-setup.exe** installs Darkride for you (or for everyone on the PC), with Start menu and optional desktop shortcuts.
          - **Darkride-$env:VERSION-windows-x64.zip** is the same files; unzip and run ``interface.exe``.

          The installer isn't code-signed yet, so Windows SmartScreen may warn: choose *More info* then *Run anyway*.
          "@
          gh release create $tag @files --title "Darkride $env:VERSION" --notes $notes --verify-tag $pre
