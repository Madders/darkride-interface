# A Darkride world: the domain server and its assignment clients in one container.
#
#   docker compose -f docker/server/docker-compose.yml up -d --build
#
# Then open http://<host>:40100 to set the world up. Its settings, entities and assets are kept in ./my-world.
services:
    my-world:
        build:
            context: ../..
            dockerfile: docker/server/Dockerfile
        image: darkride-server:latest
        restart: unless-stopped
        # host networking keeps the addresses the domain server hands out to clients right; with bridge
        # networking instead, remove this line and uncomment the port list below
        network_mode: host
        # ports:
        #     - "40100:40100/tcp" # domain server web interface (HTTP)
        #     - "40101:40101/tcp" # domain server web interface (HTTPS, when configured)
        #     - "40102:40102/udp" # domain server
        #     - "48000-48006:48000-48006/udp" # audio, avatar, asset, messages, entity script and entities servers
        volumes:
            - ./my-world:/data
        environment:
            - TIVOLI_APP_DATA_DIR=/data
            # the Darkride metaverse; the built-in default is Tivoli's, which is gone
            - HIFI_METAVERSE_URL=https://vr.darkride.ai
            # - DOMAIN_SERVER_ARGS=-i ice.example.org:7337
