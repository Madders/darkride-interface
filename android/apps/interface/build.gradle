// Darkride for Android: the APK.
//
// The native library and the PCM codec plugin are built by android/docker/build-native.sh, and androiddeployqt
// (android/docker/package-apk.sh) gathers them with Qt's libraries, jars, QML and plugins into a deploy folder,
// with the AndroidManifest it fills in for Qt's loader. This module builds the APK from that folder, the app's
// own Java and resources, Qt's Java classes and Darkride's resources and scripts.
//
//   ./gradlew :interface:assembleDebug -PDARKRIDE_DEPLOY_DIR=/work/deploy -PQT_ANDROID=/opt/qt/5.15.2/android

plugins {
    id 'com.android.application'
}

def deployDir = project.findProperty('DARKRIDE_DEPLOY_DIR') ?: System.getenv('DARKRIDE_DEPLOY_DIR') ?: '/work/deploy'
def qtAndroidDir = project.findProperty('QT_ANDROID') ?: System.getenv('QT_ANDROID') ?: '/opt/qt/5.15.2/android'
def qtJavaDir = "${qtAndroidDir}/src/android/java"
def repoRoot = new File(projectDir, '../../..')

android {
    namespace 'io.highfidelity.hifiinterface'
    compileSdk 35
    // the NDK the native libraries were built with (android/docker/Dockerfile), which strips their debug info
    ndkVersion '22.1.7171670'

    defaultConfig {
        applicationId 'ai.darkride.interface'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        ndk { abiFilters 'arm64-v8a' }
        resConfigs 'en'
    }

    sourceSets {
        main {
            // androiddeployqt's manifest: ours, with Qt's loader settings filled in
            manifest.srcFile "${deployDir}/AndroidManifest.xml"
            java.srcDirs = ['src/main/java', "${qtJavaDir}/src"]
            aidl.srcDirs = ["${qtJavaDir}/src"]
            res.srcDirs = ['src/main/res', "${qtJavaDir}/res", "${deployDir}/res"]
            assets.srcDirs = ['src/main/assets', "${deployDir}/assets"]
            jniLibs.srcDirs = ["${deployDir}/libs"]
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Qt 5.15's loader loads its libraries from the installed lib folder
        jniLibs { useLegacyPackaging true }
    }

    androidResources {
        // Darkride's resources are an uncompressed rcc file, read through Qt's asset file engine
        noCompress 'rcc'
    }

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BACKTRACE_URL', '""'
            buildConfigField 'String', 'BACKTRACE_TOKEN', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '""'
            buildConfigField 'String', 'OAUTH_REDIRECT_URI', '""'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'BACKTRACE_URL', '""'
            buildConfigField 'String', 'BACKTRACE_TOKEN', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '""'
            buildConfigField 'String', 'OAUTH_REDIRECT_URI', '""'
        }
    }

    applicationVariants.all { variant ->
        // Darkride's compiled resources and scripts go in the assets, with a list of what to unpack into the
        // cache folder (native.cpp's nativeOnCreate reads cache_assets.txt)
        variant.mergeAssetsProvider.get().doLast {
            def outputDir = variant.mergeAssetsProvider.get().outputDir.get().asFile
            def assetList = new LinkedList<String>()
            def youngestLastModified = 0

            copy {
                from new File(repoRoot, 'interface/compiledResources')
                into outputDir
                duplicatesStrategy DuplicatesStrategy.INCLUDE
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add(details.path)
                }
            }

            copy {
                from new File(repoRoot, 'scripts')
                into new File(outputDir, 'scripts')
                duplicatesStrategy DuplicatesStrategy.INCLUDE
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add('scripts/' + details.path)
                }
            }

            new File(outputDir, 'cache_assets.txt').withWriter { out ->
                out.println(Long.toString(youngestLastModified))
                assetList.each { file -> out.println(file) }
            }
        }
    }
}

dependencies {
    // Qt's jars, as androiddeployqt picked them
    implementation fileTree(dir: "${deployDir}/libs", include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.sothree.slidinguppanel:library:3.4.0'
}
