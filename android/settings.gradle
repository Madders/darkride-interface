// Darkride for Android phones and tablets (flat screen). The native library is built separately
// (android/docker/build-native.sh) and packaged with Qt by androiddeployqt (android/docker/package-apk.sh);
// this project builds the APK from that.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'darkride-android'

include ':interface'
project(':interface').projectDir = new File(settingsDir, 'apps/interface')
